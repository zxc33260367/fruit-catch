<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>芙瑞接水果</title>
<style>
:root{--ink:#12142a;--deep:#1d2a47;--amber:#ffb454;--paper:#f6e6c4;--red:#e8505b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
font-family:"Songti TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:min(100%,166vw);aspect-ratio:3/5;max-width:100%}
canvas{width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
background:rgba(18,20,42,.78);padding:24px}
#ov.hide{display:none}
h1{font-size:clamp(30px,9.5vw,44px);font-weight:900;margin:0;letter-spacing:.12em;padding-left:.12em;color:var(--amber);text-shadow:0 0 28px rgba(255,180,84,.55)}
p{margin:0;line-height:1.8;font-size:15px;max-width:22em}
button{font:inherit;font-weight:600;font-size:18px;color:var(--ink);background:var(--amber);border:0;border-radius:999px;padding:12px 34px;cursor:pointer}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#sel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px}
#sel button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:16px;background:rgba(246,230,196,.1);color:var(--paper);font-size:13px;border:2px solid transparent}
#sel button[aria-pressed=true]{border-color:var(--amber);background:rgba(255,180,84,.22)}
#sel img{height:56px;width:auto;max-width:100%;object-fit:contain}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="芙瑞接水果遊戲畫面"></canvas>
<div id="ov">
<h1 id="t">芙瑞接水果</h1>
<p id="d">選一位角色，拖曳或用左右鍵移動。接住水果補元氣，閃開火箭。</p>
<div id="sel" role="group" aria-label="選擇角色"></div>
<p id="ab" style="color:var(--amber);min-height:3.6em"></p>
<button id="b">開始遊戲</button>
</div>
</div>

const imgs=SP.map(u=>{const i=new Image();i.src=u;return i});
let ch=0;try{ch=+localStorage.getItem('tl-ch')||0}catch(e){}
const sel=document.getElementById('sel');
SP.forEach((u,i)=>{const b=document.createElement('button');b.innerHTML='<img src="'+u+'" alt=""><span>'+NM[i]+'</span>';
b.onclick=()=>{ch=i;try{localStorage.setItem('tl-ch',i)}catch(e){}mark()};sel.appendChild(b)});
function mark(){[...sel.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===ch));document.getElementById('ab').textContent=AB[ch].n}mark();
const FR=['🍎','🍊','🍋','🍇','🍓','🍉','🍑','🍒','🍌','🍍','🥝','🍐'];
let ab={dec:1,spd:1,dmg:1,rad:0,heal:13,sh:0},shield=0,tx=W/2,run=false,px=W/2,items=[],pops=[],heat=100,score=0,t=0,spawn=0,last=0,L=0,R=0;
function start(){ab=Object.assign({dec:1,spd:1,dmg:1,rad:0,heal:13,sh:0},AB[ch]);shield=ab.sh;tx=px=W/2;items=[];pops=[];heat=100;score=0;t=0;spawn=0;run=true;ov.classList.add('hide')}
function over(){
run=false;let nb=score>best;if(nb){best=score;try{localStorage.setItem('tl-best',best)}catch(e){}}
T.textContent='沒力氣了';
D.textContent='這次拿到 '+score+' 分'+(nb?'，刷新最佳紀錄！':'，最佳紀錄 '+best+' 分。');
B.textContent='再玩一次';ov.classList.remove('hide');B.focus()}
B.onclick=start;
function setX(e){const q=c.getBoundingClientRect();tx=Math.max(18,Math.min(W-18,(e.clientX-q.left)/q.width*W))}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);setX(e)});
c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')L=1;if(e.key==='ArrowRight'||e.key==='d')R=1});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')L=0;if(e.key==='ArrowRight'||e.key==='d')R=0});
function upd(dt){
t+=dt;if(R-L)tx=Math.max(18,Math.min(W-18,px+(R-L)*300));{const st=520*ab.spd*dt,df=tx-px;px+=Math.abs(df)<st?df:Math.sign(df)*st}
spawn-=dt;
if(spawn<=0){spawn=Math.max(.32,.85-t*.01);
const w=Math.random()<.6;items.push({w,f:Math.random()*FR.length|0,x:30+Math.random()*(W-60),y:-30,r:w?13:20+Math.random()*6,a:Math.random()*6,v:(w?1:1.15)*(110+t*3.2)})}
heat-=dt*ab.dec*(5+t*.08);
for(const i of items){i.y+=i.v*dt;i.a+=dt*(i.w?2:.6);
if(!i.dead&&Math.abs(i.x-px)<i.r+11+ab.rad&&Math.abs(i.y-Y)<i.r+18){i.dead=true;
if(i.w){heat=Math.min(100,heat+ab.heal);score+=10;pops.push({x:i.x,y:i.y,t:0,s:'+10',c:'#f6e6c4'})}
else if(shield){shield=0;pops.push({x:i.x,y:i.y,t:0,s:'護盾！',c:'#ffb454'})}else{heat-=28*ab.dmg;pops.push({x:i.x,y:i.y,t:0,s:'元氣 −',c:'#e8505b'})}}}
items=items.filter(i=>!i.dead&&i.y<H+50);
for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<.8);
if(heat<=0){heat=0;draw();over()}}
function draw(){
x.clearRect(0,0,W,H);
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d1f');g.addColorStop(1,'#26305a');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#f6e6c4';
for(const s of stars){if(run)s.y=(s.y+s.s*.016*(1+t*.02))%H;x.globalAlpha=.35+s.r/3;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
x.globalAlpha=1;
for(const i of items){x.save();x.translate(i.x,i.y);
if(i.w){x.rotate(Math.sin(i.a)*.3);x.shadowColor='#ffb454';x.shadowBlur=12;x.font='28px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(FR[i.f],0,0);
x.shadowBlur=0}
else if(RK.complete){x.rotate(Math.PI);const hh=i.r*2.8,ww=hh*RK.width/RK.height;x.drawImage(RK,-ww/2,-hh/2,ww,hh)}
x.restore()}
// character
const k=Math.max(.15,heat/100),im=imgs[ch],bob=Math.sin(performance.now()/260)*3;
const gl=x.createRadialGradient(px,Y,4,px,Y,90*k+20);gl.addColorStop(0,'rgba(255,180,84,'+(.4*k)+')');gl.addColorStop(1,'rgba(255,180,84,0)');
x.fillStyle=gl;x.fillRect(px-120,Y-120,240,240);
if(im.complete){const w=im.width*.62,h=im.height*.62;x.globalAlpha=.55+.45*k;x.drawImage(im,px-w/2,Y-h/2+bob,w,h);x.globalAlpha=1}
if(shield){x.strokeStyle='rgba(255,180,84,.85)';x.lineWidth=2;x.beginPath();x.arc(px,Y+bob,40,0,7);x.stroke()}
for(const p of pops){x.globalAlpha=1-p.t/.8;x.fillStyle=p.c;x.font='700 16px '+F;x.textAlign='center';x.fillText(p.s,p.x,p.y-p.t*50)}
x.globalAlpha=1;
// HUD
x.fillStyle='#f6e6c4';x.font='900 26px '+F;x.textAlign='left';x.textBaseline='alphabetic';x.fillText(score,16,36);
x.font='600 12px '+F;x.globalAlpha=.7;x.fillText('最佳 '+best,16,54);x.globalAlpha=1;
x.fillStyle='rgba(246,230,196,.18)';x.fillRect(W-136,22,120,10);
x.fillStyle=heat>30?'#ffb454':'#e8505b';x.fillRect(W-136,22,120*heat/100,10)}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)upd(dt);if(run||!ov.classList.contains('hide'))draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
